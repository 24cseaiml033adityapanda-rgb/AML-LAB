<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Predictor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="container">
    <h1>Grade Predictor</h1>
    <p class="subtitle">Multiple Linear Regression Model</p>
    
    <form id="mlr-form">
      <div class="form-group">
        <label for="study-hours">Study Hours</label>
        <input type="number" id="study-hours" name="studyHours" step="any" placeholder="e.g., 6" required>
      </div>

      <div class="form-group">
        <label for="attendance">Attendance (%)</label>
        <input type="number" id="attendance" name="attendance" step="any" placeholder="e.g., 85" required>
      </div>

      <div class="form-group">
        <label for="assignment">Assignment Score</label>
        <input type="number" id="assignment" name="assignment" step="any" placeholder="e.g., 18" required>
      </div>

      <button type="submit">Predict Final Mark</button>
    </form>

    <div id="result-container" class="result-container">
      <div class="result-label">Predicted Final Mark</div>
      <div class="result-value" id="final-mark">0.0</div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
